# Public distribution workflow: native analysis is built and tested privately.
# Package only the reviewed binaries committed with prebuilt/manifest.json.
name: SoundPrep ReaPack release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this commit to this PUBLIC repository after all checks pass
        type: boolean
        default: false
      download_repository:
        description: Public owner/repository for candidate asset URLs (blank uses this repository)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: reapack-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/windows.yml
  package:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed prebuilt helper versions and hashes
        run: python tools/prebuilt_helpers.py
      - name: Check release target
        env:
          PUBLISH: ${{ inputs.publish }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          DOWNLOAD_REPOSITORY: ${{ inputs.download_repository }}
        run: |
          python - <<'PY'
          import os
          if os.environ["PUBLISH"] == "true":
              if os.environ["PRIVATE_REPOSITORY"] != "false":
                  raise SystemExit("Public releases must be built in the public distribution repository.")
              target = os.environ["DOWNLOAD_REPOSITORY"]
              if target and target != os.environ["CURRENT_REPOSITORY"]:
                  raise SystemExit("Publishing URLs must point to this repository.")
          PY
      - name: Read package version
        id: version
        run: |
          python - <<'PY'
          import datetime, os, pathlib, re, subprocess
          text = pathlib.Path("SoundPrep.lua").read_text()
          version = re.search(r"^-- @version (\d+\.\d+\.\d+)$", text, re.M)[1]
          epoch = int(subprocess.check_output(["git", "show", "-s", "--format=%ct", "HEAD"], text=True))
          release_time = datetime.datetime.fromtimestamp(epoch, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag=v{version}\n")
              out.write(f"release_time={release_time}\n")
          PY
      - name: Load previous public index and reject existing version
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p build/previous
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > build/releases.json
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > build/tags.json
          python - <<'PY'
          import json, os, pathlib, subprocess
          releases = [r for page in json.loads(pathlib.Path("build/releases.json").read_text()) for r in page]
          tags = json.loads(pathlib.Path("build/tags.json").read_text())
          if any(t["ref"] == "refs/tags/" + os.environ["RELEASE_TAG"] for t in tags):
              raise SystemExit("This tag already exists. Publish from a new version instead.")
          if any(r["tag_name"] == os.environ["RELEASE_TAG"] for r in releases):
              raise SystemExit("This release already exists. Use a new version; published files are immutable.")
          published = [r for r in releases if not r["draft"] and not r["prerelease"]]
          if published:
              latest = json.loads(subprocess.check_output(
                  ["gh", "api", "repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/latest"], text=True))
              if not any(a["name"] == "index.xml" for a in latest["assets"]):
                  raise SystemExit("Previous release has no ReaPack index; review the migration manually.")
              subprocess.run(["gh", "release", "download", latest["tag_name"],
                              "--pattern", "index.xml", "--dir", "build/previous"], check=True)
          PY
      - name: Package runtime, binaries and ReaPack index
        env:
          DOWNLOAD_REPOSITORY: ${{ inputs.download_repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TIME: ${{ steps.version.outputs.release_time }}
        run: |
          : "${RELEASE_TIME:?Missing release timestamp}"
          args=()
          if [ -f build/previous/index.xml ]; then
            args+=(--previous-index build/previous/index.xml)
          fi
          python tools/package_release.py \
            --output build/release \
            --repository "${DOWNLOAD_REPOSITORY:-$GITHUB_REPOSITORY}" \
            --tag "$RELEASE_TAG" \
            --release-time "$RELEASE_TIME" \
            --macos-helper prebuilt/reaper_audition_macro.dylib \
            --windows-helper prebuilt/reaper_audition_macro.dll \
            "${args[@]}"
          cd build/release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: soundprep-release
          path: build/release/*
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundprep-release
          path: build/release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cd build/release
          sha256sum --check SHA256SUMS
          cd ../..
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_COMMIT" > build/release-tag.json
          gh release create "$RELEASE_TAG" build/release/* \
            --verify-tag \
            --title "SoundPrep ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md" \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
